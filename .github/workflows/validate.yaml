name: validate
on: [push, pull_request]
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (schema-validate all manifests)
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: >-
            -ignore-missing-schemas -strict -summary
            -ignore-filename-pattern values.yaml
            apps/ bootstrap/ monitoring/ crossplane/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform -chdir=infra/aws fmt -check -recursive
      - name: validate
        # -backend=false so it doesn't need credentials or remote state
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
