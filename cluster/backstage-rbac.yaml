# read-only identity backstage uses for the kubernetes tab. the token itself
# still has to be minted by hand (see the README) - this is just the account
# and what it's allowed to look at.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-viewer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-viewer
    namespace: default
---
# the built-in view role stops short of metrics.k8s.io, which is what backstage
# asks for to show cpu/memory per pod
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-viewer-metrics
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-viewer-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-viewer-metrics
subjects:
  - kind: ServiceAccount
    name: backstage-viewer
    namespace: default
