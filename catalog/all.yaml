# Backfill: these resources were requested through the portal before the infra
# templates started emitting their own catalog entities, so they're listed here
# by hand. Anything requested from now on registers itself and does not need
# adding to this file.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: infra-backfill
  description: Infra that predates self-registration
spec:
  targets:
    - ./rg-portal-demo.yaml
    - ./rg-demo-test.yaml
    - ./kv-demo-tst.yaml
    - ./demo-cluster.yaml
    - ./payments-exports.yaml
