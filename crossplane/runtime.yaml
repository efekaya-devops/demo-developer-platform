# note: no ProviderConfig here on purpose. without azure creds the composed
# resources get created in the cluster but never reconcile to real azure 
# drop in a ProviderConfig with a service principal and the same claim provisions for real.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-azure
spec:
  # the family base provider - ships the CRDs the resourcegroup blueprint
  # composes (resourcegroups.azure.upbound.io). the per-service packages
  # below add the CRD groups the other blueprints need, one provider per
  # azure service so you only pay for what you compose
  package: xpkg.upbound.io/upbound/provider-family-azure:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-dbforpostgresql
spec:
  # database blueprint: FlexibleServer + FlexibleServerFirewallRule
  package: xpkg.upbound.io/upbound/provider-azure-dbforpostgresql:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-keyvault
spec:
  # keyvault blueprint: Vault
  package: xpkg.upbound.io/upbound/provider-azure-keyvault:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-network
spec:
  # virtualnetwork blueprint: VNet + Subnet + SecurityGroup + the association
  package: xpkg.upbound.io/upbound/provider-azure-network:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-storage
spec:
  # storage blueprint: Account
  package: xpkg.upbound.io/upbound/provider-azure-storage:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-web
spec:
  # webappplatform blueprint: ServicePlan + LinuxWebApp. 
  package: xpkg.upbound.io/upbound/provider-azure-web:v1.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-insights
spec:
  # webappplatform blueprint: ApplicationInsights
  package: xpkg.upbound.io/upbound/provider-azure-insights:v1.11.0
