# the bits crossplane needs before any blueprint will render:
# - the function the compositions call in their pipeline
# - the provider that owns the azure CRDs the compositions compose
#
# note: no ProviderConfig here on purpose. without azure creds the composed
# resources get created in the cluster but never reconcile to real azure -
# which is exactly what we want for a local demo. drop in a ProviderConfig
# with a service principal and the same claim provisions for real.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-azure
spec:
  # the family base provider - small, and it already ships the CRDs the
  # resourcegroup blueprint composes (resourcegroups.azure.upbound.io).
  # per-service packages (provider-azure-network etc) go on top if you need
  # more resource types later
  package: xpkg.upbound.io/upbound/provider-family-azure:v1.11.0
