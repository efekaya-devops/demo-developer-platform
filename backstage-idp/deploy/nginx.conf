# Fronts the Backstage backend. install.sh substitutes __DOMAIN__, then hands
# this to certbot, which rewrites it in place to add the TLS listener and the
# http -> https redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    # Guest sign-in is on so visitors can browse without an account, and a guest
    # token is enough to drive the scaffolder. Running the golden path is not a
    # read: it creates a public repository in the platform's GitHub org, starts a
    # workflow that pushes an image, and the ApplicationSet then deploys the
    # result into this cluster. So an anonymous visitor could name a public repo
    # anything they like inside an org that carries the owner's name, and could
    # fill a 2-vCPU box with pods until the demo falls over.
    #
    # Reads stay open - the catalog is the demo. Writes are refused outright.
    location /api/scaffolder/ {
        # No exceptions, not even for the operator: this is a read-only demo.
        # The portal shows a red notice on the Create pages explaining that the
        # 403 is the boundary working, not a broken deployment.
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # scaffolder tasks stream their log over a long-lived connection
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
