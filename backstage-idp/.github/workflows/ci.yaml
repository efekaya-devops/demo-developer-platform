name: ci
on:
  pull_request:
  push:
    branches: [main]

# 22.22.3 specifically, not just "22" - see the note at the top of
# packages/backend/Dockerfile about 22.23.0 breaking node-fetch
env:
  NODE_VERSION: 22.22.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn backstage-cli repo lint

  image:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # the backend Dockerfile is the "host build" kind - it only copies
      # dist/bundle.tar.gz and dist/skeleton.tar.gz in, it doesn't compile
      # anything itself. so these have to run first or the COPY fails with
      # "bundle.tar.gz: not found".
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn build:backend

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          # tag with the commit too, so "latest" isn't the only way to
          # refer to a build
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
