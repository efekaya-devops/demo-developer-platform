# requested through the portal, don't hand-edit - raise a new request instead.
# the portal discovers this file on merge, which is what puts the resource on
# the catalog. no registration step needed.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.platformName }}
  description: >-
    Azure app service platform (plan + web app + application insights),
    requested through the portal
  tags:
    - azure
    - crossplane
    - appservice
  links:
    - title: The claim in git
      url: https://github.com/efekaya-devex-platform/team-alpha/blob/main/claims/${{ values.platformName }}.yaml
spec:
  type: azure-webapp-platform
  owner: ${{ values.team }}
  system: platform-infra
  dependsOn:
    - resource:default/${{ values.resourceGroup }}
