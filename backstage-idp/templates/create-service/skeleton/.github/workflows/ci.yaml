name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test --if-present
      # amd64 alone means the image won't start on an Apple Silicon or Graviton
      # cluster - it fails with "exec format error", which reads like a broken
      # app rather than a missing architecture. QEMU makes the arm64 half
      # slower to build, and portable to run.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ '${{ github.repository }}' }}:latest
            ghcr.io/${{ '${{ github.repository }}' }}:${{ '${{ github.sha }}' }}
