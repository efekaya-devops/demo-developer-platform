server {
    # 8080, not 80 - the unprivileged nginx image runs as a non-root user and
    # can't bind a privileged port
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # single-page app: any unknown path is a client-side route, not a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # what the kubelet probes hit
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # nginx's own counters, read by the exporter sidecar and turned into
    # prometheus metrics. localhost only - this is not for the internet
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
