# 3 nodes so it at least looks like a real cluster, not just 1 node doing everything
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # ArgoCD UI (NodePort)
        hostPort: 8081
      - containerPort: 30030   # Grafana (NodePort)
        hostPort: 3001
  - role: worker
  - role: worker
