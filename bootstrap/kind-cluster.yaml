# Local three-node cluster — mirrors a real topology (1 control plane, 2 workers)
# without any cloud dependency.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # ArgoCD UI (NodePort)
        hostPort: 8081
      - containerPort: 30030   # Grafana (NodePort)
        hostPort: 3001
  - role: worker
  - role: worker
