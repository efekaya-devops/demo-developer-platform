# whatever team-alpha has asked for via the portal.
# the claims live in the team's own repo, not this one
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-team-alpha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/efekaya-devex-platform/team-alpha
    targetRevision: main
    path: claims
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
