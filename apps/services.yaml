# any repo in the org with a k8s/ folder gets picked up and synced automatically 
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    # last wave on purpose. this needs the github-token secret, and without it
    # the scm generator errors - in wave 0 that aborted the whole app-of-apps
    # sync, so crossplane, the XRDs and the team claims (waves 1-3) never got
    # applied. a fork that skips the secret step should lose service discovery,
    # not the entire provisioning layer.
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - scmProvider:
        # https so argocd uses the token secret, not ssh keys
        cloneProtocol: https
        requeueAfterSeconds: 60
        github:
          organization: efekaya-devex-platform
          tokenRef: { secretName: github-token, key: token }
        filters:
          - pathsExist: [k8s]
  template:
    metadata:
      name: '{{ repository }}'
    spec:
      project: default
      source:
        repoURL: '{{ url }}'
        targetRevision: '{{ branch }}'
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
