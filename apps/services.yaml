# any repo tagged idp-service gets picked up and synced automatically,
# don't need to touch this file when a new service shows up
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  generators:
    - scmProvider:
        github:
          organization: GITHUB_ORG
          # tokenRef optional for public repos; set for private orgs:
          # tokenRef: { secretName: github-token, key: token }
        filters:
          - topic: idp-service
  template:
    metadata:
      name: '{{ repository }}'
    spec:
      project: default
      source:
        repoURL: '{{ url }}'
        targetRevision: '{{ branch }}'
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
