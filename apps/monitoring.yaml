apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # kind runs a newer k8s than this argocd's built-in schema knows about, so
    # the normal diff blows up on fields like .status.terminatingReplicas and
    # the app sits on "Unknown" forever. this diffs via the api server instead,
    # which obviously does know its own fields. (ServerSideApply below is a
    # different thing - that's the apply, this is the compare.)
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://github.com/efekaya-devops/idp-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
