# the blueprints themselves (XRD + Composition) come straight out of the
# crossplane-modules repo - that repo is the source of truth for what our
# platform APIs look like, this installs all of them.
# wave 2 - needs the provider CRDs from wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/efekaya-devops/crossplane-modules
    targetRevision: main
    path: modules
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
